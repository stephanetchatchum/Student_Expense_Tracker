<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Tests</title>
</head>
<body>
    <h1>Regex Validation Tests</h1>

    <script>
        const descriptionPattern = /^\S(?:.*\S)?$/;
        const amountPattern = /^(0|[1-9]\d*)(\.\d{1,2}?$)/;
        console.log(amountPattern.test("0"));
        console.log(amountPattern.test("12"));
        console.log(amountPattern.test("12.5"));
        console.log(amountPattern.test("12.50"));
        console.log(amountPattern.test("007"));
        console.log(amountPattern.test("12.555"));

        const wrongPattern = /^[0-9]\d*$/;
        console.log(wrongPattern.test("007"));   // what do you predict?

        const correctPattern = /^(0|[1-9]\d*)$/;
        console.log(correctPattern.test("007")); // what do you predict?
    </script>
</body>
</html>
